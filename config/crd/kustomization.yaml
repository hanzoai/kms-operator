# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
  - bases/secrets.lux.network_kmssecrets.yaml
  - bases/secrets.lux.network_kmspushsecrets.yaml
  - bases/secrets.lux.network_clustergenerators.yaml
  # Password and UUID are generator types (api/v1alpha1/generators.go), consumed
  # by a KMSSecret's generatorRef rather than reconciled by a controller of their
  # own — which is presumably why they were never listed. But a CRD that is not
  # installed is a KMSSecret that fails at admission, and every cluster in the
  # estate already HAS these two installed, so the install manifest was
  # describing a narrower operator than the one actually deployed.
  - bases/secrets.lux.network_passwords.yaml
  - bases/secrets.lux.network_uuids.yaml
#+kubebuilder:scaffold:crdkustomizeresource

patchesStrategicMerge:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
#- patches/webhook_in_kmssecrets.yaml
#+kubebuilder:scaffold:crdkustomizewebhookpatch

# [CERTMANAGER] To enable cert-manager, uncomment all the sections with [CERTMANAGER] prefix.
# patches here are for enabling the CA injection for each CRD
#- patches/cainjection_in_kmssecrets.yaml
#+kubebuilder:scaffold:crdkustomizecainjectionpatch

# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
  - kustomizeconfig.yaml
